name: Build APK with Buildozer
on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo-dev cmake libffi-dev libssl-dev
          pip3 install --user --upgrade buildozer

      - name: Build with Buildozer
        run: |
          # ڕێکخستنی مۆڵەتەکان بە شێوەیەکی جێگیر
          export ANDROIDSDK=$HOME/.buildozer/android/platform/android-sdk
          export PATH=$PATH:$ANDROIDSDK/cmdline-tools/latest/bin
          
          # بەکارهێنانی فەرمانێک بۆ دانانی مۆڵەتەکان پێش ئەوەی buildozer دەست پێبکات
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          buildozer android debug
